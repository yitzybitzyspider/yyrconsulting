function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function show(buf){var h=new TextDecoder().decode(buf);document.open();document.write(h);document.close();}
function dec(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},k,u8(D.c));}
var KK='mba202-key-v1';
(async function(){
  var saved=null;try{saved=localStorage.getItem(KK);}catch(e){}
  if(saved){try{var k=await crypto.subtle.importKey('raw',u8(saved),'AES-GCM',false,['decrypt']);show(await dec(k));return;}catch(e){try{localStorage.removeItem(KK);}catch(x){}}}
  document.getElementById('gate').hidden=false;document.getElementById('pw').focus();
})();
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();var err=document.getElementById('err'),go=document.getElementById('go');err.textContent='';go.textContent='Opening...';
  try{
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
    var out=await dec(k);
    if(document.getElementById('rm').checked){try{var raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));localStorage.setItem(KK,btoa(String.fromCharCode.apply(null,raw)));}catch(x){}}
    show(out);
  }catch(x){err.textContent='That password did not work.';go.textContent='Open';}
});
